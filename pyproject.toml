[project]
name = "fpptools"
dynamic = ["version"]
description = "Administration and debugging CLI for emmegisoft FP Pro (structures, blocks, jobs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andres Perez", email = "me@aperezc.xyz" }]
requires-python = ">=3.10"
classifiers = [
    "Topic :: Utilities",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pymysql>=1.1",
    # Access/MDB configs (CONN_STR_FP_PRO=0) need the Microsoft Access ODBC driver; Windows only.
    "pyodbc>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/andoresuperesu/fpptools"

[project.scripts]
fpptools = "fpptools.cli:main"
fpptools-estructuras = "fpptools.quick:main"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.7"]
build = ["pyinstaller>=6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fpptools/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["fpptools", "tests", "scripts", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["fpptools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
